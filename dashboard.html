<!DOCTYPE html>
<html>
<head>

<title>Inventra Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{font-family:Arial;margin:0;background:#111;color:white;}

.sidebar{
width:220px;
position:fixed;
height:100%;
background:#1a1a1a;
padding-top:20px;
}

.sidebar button{
width:100%;
padding:15px;
border:none;
background:none;
color:white;
cursor:pointer;
}

.sidebar button:hover{background:#333;}

.main{margin-left:230px;padding:20px;}

.cards{display:flex;gap:20px;margin-bottom:20px;}

.card{
background:#222;
padding:20px;
flex:1;
border-radius:8px;
}

.table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

.table th,.table td{
padding:10px;
border-bottom:1px solid #444;
}

button.action{
background:#0077ff;
border:none;
color:white;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
margin:2px;
}

button.delete{background:#c0392b;}

button.edit{background:#27ae60;}

button.export{background:#f39c12;}

input,select{
padding:6px;
margin:5px;
}

canvas{
max-width:600px;
height:300px !important;
}

.notification{
position:fixed;
top:20px;
right:30px;
cursor:pointer;
font-size:20px;
}

.badge{
background:red;
padding:3px 7px;
border-radius:50%;
}

.alert-box{
display:none;
position:fixed;
top:60px;
right:20px;
background:#222;
padding:20px;
width:250px;
border-radius:8px;
}

.warning{
background:#f39c12;
padding:8px;
margin-top:5px;
border-radius:4px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2 style="text-align:center">Inventra</h2>

<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('inventory')">Inventory</button>
<button onclick="show('transactions')">Transactions</button>
<button onclick="show('pending')">Pending Users</button>
<button onclick="show('locked')">Locked Users</button>
<button onclick="show('analytics')">Analytics</button>
<button onclick="logout()">Logout</button>

</div>

<div class="main">

<!-- DASHBOARD -->

<div id="dashboard">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Products</h3>
<p id="totalProducts">0</p>
</div>

<div class="card">
<h3>Total Transactions</h3>
<p id="totalTransactions">0</p>
</div>

<div class="card">
<h3>Low Stock</h3>
<p id="lowStock">0</p>
</div>

</div>

</div>

<!-- INVENTORY -->

<div id="inventory" style="display:none">

<h2>Inventory</h2>

<input type="text" id="searchProduct" placeholder="Search product..." onkeyup="searchProduct()">

<select id="stockFilter" onchange="filterStock()">
<option value="all">All</option>
<option value="low">Low Stock</option>
<option value="normal">Normal Stock</option>
</select>

<button class="action" onclick="addProduct()">➕ Add Product</button>
<button class="export action" onclick="exportExcel()">📤 Export Excel</button>
<button class="export action" onclick="exportPDF()">📄 Export PDF</button>

<table class="table">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Stock</th>
<th>Min Level</th>
<th>Action</th>
</tr>
</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<!-- TRANSACTIONS -->

<div id="transactions" style="display:none">

<h2>Transactions</h2>

<table class="table">

<thead>
<tr>
<th>Product</th>
<th>Type</th>
<th>Quantity</th>
<th>User</th>
</tr>
</thead>

<tbody id="transactionTable"></tbody>

</table>

</div>

<!-- PENDING USERS -->

<div id="pending" style="display:none">

<h2>Pending Users</h2>

<table class="table">

<thead>
<tr>
<th>ID</th>
<th>User</th>
<th>Email</th>
<th>Action</th>
</tr>
</thead>

<tbody id="pendingTable"></tbody>

</table>

</div>

<!-- LOCKED USERS -->

<div id="locked" style="display:none">

<h2>Locked Users</h2>

<table class="table">

<thead>
<tr>
<th>ID</th>
<th>User</th>
<th>Email</th>
<th>Action</th>
</tr>
</thead>

<tbody id="lockedTable"></tbody>

</table>

</div>

<!-- ANALYTICS -->

<div id="analytics" style="display:none">

<h2>Analytics</h2>

<canvas id="stockChart"></canvas>

</div>

</div>

<div class="notification" onclick="toggleAlerts()">
🔔 <span id="alertCount" class="badge">0</span>
</div>

<div id="alertBox" class="alert-box">
<h4>Low Stock Alerts</h4>
<div id="alertList"></div>
</div>

<script>

const API="http://localhost:8080";
const token=localStorage.getItem("token");

function authHeaders(){
return{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
};
}

let productsCache=[];

/* LOAD INVENTORY */

async function loadInventory(){

let res=await fetch(API+"/api/products",{headers:authHeaders()});
let data=await res.json();

productsCache=data;

renderInventory(data);

updateDashboard(data);

checkLowStock(data);

}

/* RENDER TABLE */

function renderInventory(data){

let table=document.getElementById("inventoryTable");
table.innerHTML="";

data.forEach(p=>{
table.innerHTML+=`
<tr>
<td>${p.id}</td>
<td>${p.name}</td>
<td>${p.stockQuantity}</td>
<td>${p.minStockLevel}</td>

<td>

<button class="edit action"
onclick="editProduct(${p.id},'${p.name}',${p.stockQuantity},${p.minStockLevel})">
Edit
</button>

<button class="delete action"
onclick="deleteProduct(${p.id})">
Delete
</button>

</td>



</tr>
`;
});

}

/* SEARCH */

function searchProduct(){

let text=document.getElementById("searchProduct").value.toLowerCase();

let filtered=productsCache.filter(p=>
p.name.toLowerCase().includes(text)
);

renderInventory(filtered);

}

/* FILTER */

function filterStock(){

let type=document.getElementById("stockFilter").value;

let filtered=[...productsCache];

if(type==="low"){
filtered=filtered.filter(p=>p.stockQuantity<p.minStockLevel);
}

if(type==="normal"){
filtered=filtered.filter(p=>p.stockQuantity>=p.minStockLevel);
}

renderInventory(filtered);

}

/* ADD PRODUCT */

async function addProduct(){

let name=prompt("Product Name");
let stock=prompt("Stock Quantity");
let min=prompt("Min Stock Level");

await fetch(API+"/api/products",{

method:"POST",
headers:authHeaders(),

body:JSON.stringify({
name:name,
stockQuantity:stock,
minStockLevel:min
})

});

loadInventory();

}

/* EDIT */

async function editProduct(id,name,stock,min){

let newName=prompt("Edit Name",name);
let newStock=prompt("Edit Stock",stock);
let newMin=prompt("Edit Min Level",min);

await fetch(API+"/api/products/"+id,{

method:"PUT",
headers:authHeaders(),

body:JSON.stringify({
name:newName,
stockQuantity:newStock,
minStockLevel:newMin
})

});

loadInventory();

}

/* DELETE */

async function deleteProduct(id){

if(!confirm("Delete product?")) return;

await fetch(API+"/api/products/"+id,{
method:"DELETE",
headers:authHeaders()
});


loadInventory();

}

/* EXPORT EXCEL */

function exportExcel(){

let csv="ID,Name,Stock,Min Level\n";

productsCache.forEach(p=>{
csv+=`${p.id},${p.name},${p.stockQuantity},${p.minStockLevel}\n`;
});

let blob=new Blob([csv]);

let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="inventory.csv";
a.click();

}

/* EXPORT PDF */

function exportPDF(){

const { jsPDF } = window.jspdf;

let doc=new jsPDF();

let y=10;

doc.text("Inventra Inventory Report",10,y);

y+=10;

productsCache.forEach(p=>{

doc.text(
`${p.id}  ${p.name}  Stock:${p.stockQuantity}`,
10,y
);

y+=8;

});

doc.save("inventory.pdf");

}

/* TRANSACTIONS */

async function loadTransactions(){

let res=await fetch(API+"/api/products/transactions",{headers:authHeaders()});
let data=await res.json();

let table=document.getElementById("transactionTable");
table.innerHTML="";

data.forEach(t=>{
table.innerHTML+=`
<tr>
<td>${t.product.name}</td>
<td>${t.type}</td>
<td>${t.quantity}</td>
<td>${t.performedBy}</td>
</tr>`;
});

document.getElementById("totalTransactions").innerText=data.length;

}

/* USERS */

async function loadPendingUsers(){

let res=await fetch(API+"/api/auth/pending",{headers:authHeaders()});
let users=await res.json();

let table=document.getElementById("pendingTable");
table.innerHTML="";

users.forEach(u=>{
table.innerHTML+=`
<tr>
<td>${u.id}</td>
<td>${u.username}</td>
<td>${u.email}</td>

<td>
<button class="action" onclick="approveUser(${u.id})">Approve</button>
</td>

</tr>`;
});

}

async function approveUser(id){

await fetch(API+"/api/auth/approve/"+id,{
method:"PUT",
headers:authHeaders()
});

loadPendingUsers();

}

async function loadLockedUsers(){

let res=await fetch(API+"/api/auth/locked",{headers:authHeaders()});
let users=await res.json();

let table=document.getElementById("lockedTable");
table.innerHTML="";

users.forEach(u=>{
table.innerHTML+=`
<tr>
<td>${u.id}</td>
<td>${u.username}</td>
<td>${u.email}</td>

<td>
<button class="action" onclick="unlockUser(${u.id})">Unlock</button>
</td>

</tr>`;
});

}

async function unlockUser(id){

await fetch(API+"/api/auth/unlock/"+id,{
method:"PUT",
headers:authHeaders()
});

loadLockedUsers();

}

/* DASHBOARD */

function updateDashboard(products){

document.getElementById("totalProducts").innerText=products.length;

let low=products.filter(p=>p.stockQuantity<p.minStockLevel);

document.getElementById("lowStock").innerText=low.length;

}

/* ANALYTICS */

let chart;

async function loadChart(){

let res=await fetch(API+"/api/reports/generate",{headers:authHeaders()});
let data=await res.json();

const ctx=document.getElementById("stockChart");

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:"bar",
data:{
labels:Object.keys(data),
datasets:[{
label:"Inventory",
data:Object.values(data),
backgroundColor:"#4da6ff"
}]
}
});

}

/* NAVIGATION */

function show(section){

document.querySelectorAll(".main > div").forEach(d=>d.style.display="none");

document.getElementById(section).style.display="block";

if(section==="inventory") loadInventory();
if(section==="transactions") loadTransactions();
if(section==="analytics") loadChart();
if(section==="pending") loadPendingUsers();
if(section==="locked") loadLockedUsers();

}

function logout(){
localStorage.removeItem("token");
window.location.href="index.html";
}

/* ALERT TOGGLE */

function toggleAlerts(){

let box=document.getElementById("alertBox");

box.style.display = box.style.display === "block" ? "none" : "block";

}

/* CHECK LOW STOCK */

function checkLowStock(products){

let alerts=[];

products.forEach(p=>{
if(p.stockQuantity < p.minStockLevel){
alerts.push(p.name + " LOW STOCK");
}
});

let list=document.getElementById("alertList");
list.innerHTML="";

alerts.forEach(a=>{
list.innerHTML += `<div class="warning">${a}</div>`;
});

document.getElementById("alertCount").innerText = alerts.length;

}
/* INIT */

window.onload=function(){

loadInventory();
loadTransactions();
loadPendingUsers();
loadLockedUsers();

}

</script>

</body>
</html>
